<svg xmlns="http://www.w3.org/2000/svg" width="510" height="200" viewBox="0 0 510 200" font-family="Arial" font-size="12">
  <!-- Produk -->
  <rect x="10" y="10" width="200" height="182" fill="#ffffff" stroke="#57606a"/>
  <rect x="10" y="10" width="200" height="28" fill="#eff2f6" stroke="#57606a"/>
  <text x="110" y="29" text-anchor="middle" font-weight="bold">Produk</text>
  <line x1="46" y1="38" x2="46" y2="192" stroke="#d0d7de"/>
  <g>
    <text x="18" y="55" font-weight="bold">PK</text><text x="54" y="55" text-decoration="underline">id : string</text>
    <text x="54" y="77">nama : string</text>
    <text x="54" y="99">kategori : string</text>
    <text x="54" y="121">harga : number</text>
    <text x="54" y="143">stok : number</text>
    <text x="54" y="165">rating : number desimal</text>
    <text x="54" y="187">terjual : number</text>
  </g>

  <!-- Item keranjang -->
  <rect x="330" y="60" width="170" height="72" fill="#ffffff" stroke="#57606a"/>
  <rect x="330" y="60" width="170" height="28" fill="#eff2f6" stroke="#57606a"/>
  <text x="415" y="79" text-anchor="middle" font-weight="bold">Item (keranjang)</text>
  <line x1="366" y1="88" x2="366" y2="132" stroke="#d0d7de"/>
  <text x="338" y="105" font-weight="bold">FK</text><text x="374" y="105">idProduk : string</text>
  <text x="374" y="125">qty : number</text>

  <!-- Relasi: Produk tepat satu, Item nol atau banyak -->
  <line x1="210" y1="110" x2="330" y2="110" stroke="#24292f" stroke-width="1.3"/>
  <line x1="220" y1="102" x2="220" y2="118" stroke="#24292f" stroke-width="1.3"/>
  <line x1="227" y1="102" x2="227" y2="118" stroke="#24292f" stroke-width="1.3"/>
  <line x1="316" y1="110" x2="330" y2="101" stroke="#24292f" stroke-width="1.3"/>
  <line x1="316" y1="110" x2="330" y2="119" stroke="#24292f" stroke-width="1.3"/>
  <circle cx="308" cy="110" r="5" fill="#ffffff" stroke="#24292f" stroke-width="1.3"/>
  <text x="266" y="100" text-anchor="middle" font-size="10" fill="#57606a">idProduk = id</text>
</svg>

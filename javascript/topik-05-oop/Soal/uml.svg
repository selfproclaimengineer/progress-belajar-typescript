<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" font-family="Arial" font-size="12">
  <defs>
    <marker id="segitiga" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="14" markerHeight="14" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffffff" stroke="#24292f" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Rekening -->
  <rect x="20" y="10" width="270" height="190" fill="#ffffff" stroke="#57606a"/>
  <rect x="20" y="10" width="270" height="26" fill="#eff2f6" stroke="#57606a"/>
  <text x="155" y="28" text-anchor="middle" font-weight="bold">Rekening</text>
  <text x="30" y="54">+ nomor : string</text>
  <text x="30" y="72">+ pemilik : string</text>
  <text x="30" y="90">- #saldo : number</text>
  <line x1="20" y1="100" x2="290" y2="100" stroke="#57606a"/>
  <text x="30" y="118">+ constructor(nomor, pemilik, saldoAwal = 0)</text>
  <text x="30" y="136">+ get saldo() : number</text>
  <text x="30" y="154">+ info() : string</text>
  <text x="30" y="172">+ setor(nominal : number) : string</text>
  <text x="30" y="190">+ tarik(nominal : number) : string</text>

  <!-- Tabungan -->
  <rect x="20" y="270" width="270" height="130" fill="#ffffff" stroke="#57606a"/>
  <rect x="20" y="270" width="270" height="26" fill="#eff2f6" stroke="#57606a"/>
  <text x="155" y="288" text-anchor="middle" font-weight="bold">Tabungan</text>
  <text x="30" y="314">+ bungaPersen : number</text>
  <line x1="20" y1="324" x2="290" y2="324" stroke="#57606a"/>
  <text x="30" y="342">+ constructor(nomor, pemilik, saldoAwal,</text>
  <text x="30" y="358">               bungaPersen)</text>
  <text x="30" y="376">+ tambahBunga() : string</text>
  <text x="30" y="394">+ info() : string  (menimpa)</text>

  <!-- Pewarisan: Tabungan extends Rekening -->
  <line x1="155" y1="270" x2="155" y2="201" stroke="#24292f" stroke-width="1.3" marker-end="url(#segitiga)"/>
  <text x="165" y="240" font-size="10" fill="#57606a">extends</text>

  <!-- Bank -->
  <rect x="390" y="40" width="230" height="130" fill="#ffffff" stroke="#57606a"/>
  <rect x="390" y="40" width="230" height="26" fill="#eff2f6" stroke="#57606a"/>
  <text x="505" y="58" text-anchor="middle" font-weight="bold">Bank</text>
  <text x="400" y="84">+ daftar : Rekening[]</text>
  <line x1="390" y1="94" x2="620" y2="94" stroke="#57606a"/>
  <text x="400" y="112">+ buka(rek : Rekening) : string</text>
  <text x="400" y="128">+ cari(nomor : string) : Rekening</text>
  <text x="400" y="144">+ transfer(dari, ke, nominal) : string</text>
  <text x="400" y="160">+ totalSaldo() : number</text>

  <!-- Agregasi: Bank menyimpan 0..* Rekening -->
  <line x1="290" y1="105" x2="376" y2="105" stroke="#24292f" stroke-width="1.3"/>
  <path d="M390,105 L383,100 L376,105 L383,110 Z" fill="#ffffff" stroke="#24292f" stroke-width="1.3"/>
  <text x="296" y="98" font-size="10" fill="#57606a">0..*</text>
  <text x="372" y="98" font-size="10" fill="#57606a" text-anchor="end">1</text>
</svg>
